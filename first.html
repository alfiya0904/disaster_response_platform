<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disaster Response</title>
    <script src="api-config.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #182b3a, #314b5c);
        }

        /* MAIN MOBILE SCREEN */

        .phone {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            background: #ffffff;
            overflow: hidden;
            border-radius: 22px;
            border: 2px solid #bfc7cc;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            position: relative;
        }

        /* RESCUE SCENE */

        .scene {
            width: 100%;
            height: 445px;
            overflow: hidden;
            background: #6c9fba;
        }

        .scene svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* BOTTOM CONTENT */

        .content {
            position: relative;
            min-height: calc(100vh - 445px);
            background: linear-gradient(to bottom, #ffffff, #f2f4f5);
            text-align: center;
            padding: 22px 20px 100px;
        }

        .content::before {
            content: "";
            position: absolute;
            top: -30px;
            left: -5%;
            width: 110%;
            height: 55px;
            background: #ffffff;
            border-radius: 50% 50% 0 0;
        }

        /* 3D RED HEART */

        .logo {
            width: 95px;
            height: 95px;
            position: relative;
            z-index: 2;
            margin: -20px auto 5px;
            filter: drop-shadow(0 8px 8px rgba(120,0,0,0.30));
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        /* TEXT */

        h1 {
            position: relative;
            z-index: 2;
            margin-top: 5px;
            font-size: 23px;
            font-weight: 700;
            color: #26323a;
        }

        .tagline {
            position: relative;
            z-index: 2;
            margin-top: 12px;
            font-size: 13px;
            color: #5d666d;
        }

        /* BLUE GO BUTTON */

        .go-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            width: 145px;
            height: 52px;

            border: none;
            border-radius: 28px;

            background: linear-gradient(
                145deg,
                #4f9cff,
                #1976e8,
                #0955b5
            );

            color: white;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:
                0 8px 0 #063d8a,
                0 12px 22px rgba(0,75,170,0.30);

            transition: 0.2s;
        }

        .go-btn:hover {
            transform: translateX(-50%) scale(1.04);
        }

        .go-btn:active {
            transform: translateX(-50%) translateY(4px);
            box-shadow:
                0 4px 0 #063d8a,
                0 7px 14px rgba(0,75,170,0.30);
        }

        @media(max-width:390px) {
            .phone {
                border-radius: 0;
                border: none;
            }
        }

    </style>
</head>
